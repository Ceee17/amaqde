[project]
name = "idx-swrt-engine"
version = "0.1.0"
description = "100% Free ($0/month), Local-First, Auditable Multi-Agent Quantitative Decision Engine for the Indonesia Stock Exchange (IDX / BEI)"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pot==0.9.4",
    "numpy>=2.0.0,<2.3.0",
    "scipy>=1.13.0,<1.16.0",
    "cvxpy>=1.5.0,<1.6.0",
    "osqp>=0.6.7,<1.0.0",
    "clarabel>=0.9.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
